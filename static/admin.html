<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA LUNARIS 時曜 | 品牌香氛管理後台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

    <div id="loginScreen" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-2xl p-8 max-w-sm w-full mx-4">
            <div class="text-center mb-6">
                <span class="bg-[#c8a45d] text-black text-xs font-bold px-2.5 py-1 rounded">ADMIN SECURITY</span>
                <h2 class="text-xl font-black text-slate-900 mt-3">時曜 營運管理後台</h2>
                <p class="text-xs text-slate-400 mt-1">預設帳號：<code class="text-slate-700 font-bold">admin</code> ／ 密碼：<code class="text-slate-700 font-bold">123456</code></p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4 text-sm">
                <div><label class="block text-xs font-bold text-slate-600 mb-1">管理員帳號</label><input id="loginUser" value="admin" required class="w-full border rounded px-3 py-2"></div>
                <div><label class="block text-xs font-bold text-slate-600 mb-1">管理員密碼</label><input id="loginPass" type="password" value="123456" required class="w-full border rounded px-3 py-2"></div>
                <button type="submit" class="w-full bg-slate-900 hover:bg-black text-[#e6c786] font-bold py-2.5 rounded">登入管理後台</button>
                <a href="/" class="block text-center text-xs text-slate-400 hover:text-slate-600 pt-2">← 返回前台商店</a>
            </form>
        </div>
    </div>

    <header class="bg-slate-900 text-white sticky top-0 z-40 shadow">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="bg-[#c8a45d] text-black text-xs font-bold px-2 py-1 rounded">AURA ADMIN</span>
                <h1 class="text-lg font-bold tracking-wide">AURA LUNARIS 時曜 香氛管理後台</h1>
            </div>
            <div class="flex items-center space-x-3">
                <a href="/" class="text-xs bg-white text-slate-900 hover:bg-slate-200 px-3 py-1.5 rounded font-semibold"><i class="fa-solid fa-store mr-1"></i>查看前台展示</a>
                <button onclick="logout()" class="text-xs bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded font-semibold">登出</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">
        <div class="bg-white p-6 rounded-lg shadow-sm border-t-4 border-slate-900">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b">
                <div>
                    <h2 class="text-base font-bold text-slate-900"><i class="fa-solid fa-layer-group text-[#c8a45d] mr-1.5"></i>前台「大品項分類」管理</h2>
                    <p class="text-xs text-slate-500 mt-0.5">點選下方分類可切換檢視該分類底下的香水商品；在此增刪分類會同步更新至前台導覽列。</p>
                </div>
                <form onsubmit="addCategory(event)" class="flex gap-2">
                    <input id="newCatName" required class="border rounded px-3 py-1.5 text-sm" placeholder="輸入新分類名稱">
                    <button type="submit" class="bg-slate-900 hover:bg-black text-[#e6c786] text-xs font-bold px-4 py-2 rounded whitespace-nowrap">+ 新增分類</button>
                </form>
            </div>
            <div id="categoryTags" class="flex flex-wrap gap-2.5 pt-4"></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="bg-white p-6 rounded-lg shadow-sm h-fit border-t-4 border-[#c8a45d]">
                <div class="flex justify-between items-center mb-4 pb-2 border-b">
                    <h2 id="formTitle" class="text-base font-bold"><i class="fa-solid fa-pen-to-square text-[#c8a45d] mr-1.5"></i>上架新香氛與圖文介紹</h2>
                    <button id="cancelEditBtn" onclick="resetForm()" class="hidden text-xs text-slate-400 hover:text-black">取消編輯</button>
                </div>
                <form onsubmit="saveProduct(event)" class="space-y-3 text-sm">
                    <input type="hidden" id="editProductId" value="">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">所屬大品項系列</label>
                        <select id="pCat" required class="w-full border rounded px-3 py-2 bg-slate-50 font-semibold"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">香氛名稱</label>
                        <input id="pName" required class="w-full border rounded px-3 py-1.5" placeholder="例如：丑牛 · 厚土引">
                    </div>

                    <div class="p-3 bg-slate-50 rounded border border-slate-200 space-y-2">
                        <div class="text-xs font-bold text-slate-700">各容量典藏價格與庫存設定 (NT$)</div>
                        <div class="grid grid-cols-3 gap-2">
                            <div><label class="block text-[11px] text-slate-500 mb-0.5">30ml 價格</label><input id="pPrice30" type="number" required value="1800" class="w-full border rounded px-2 py-1 text-xs"></div>
                            <div><label class="block text-[11px] text-slate-500 mb-0.5">50ml 價格</label><input id="pPrice50" type="number" required value="3000" class="w-full border rounded px-2 py-1 text-xs"></div>
                            <div><label class="block text-[11px] text-slate-500 mb-0.5">100ml 價格</label><input id="pPrice100" type="number" required value="4800" class="w-full border rounded px-2 py-1 text-xs"></div>
                        </div>
                        <div>
                            <label class="block text-[11px] text-slate-500 mb-0.5">總庫存席次</label>
                            <input id="pStock" type="number" required value="30" class="w-full border rounded px-2 py-1 text-xs">
                        </div>
                    </div>

                    <!-- 多圖上傳區塊 -->
                    <div class="p-3 bg-slate-50 border border-dashed rounded space-y-2">
                        <label class="block text-xs font-bold text-slate-700"><i class="fa-solid fa-images mr-1"></i>上傳香水照片（支援一次選取多張）</label>
                        <input type="file" id="pFiles" accept="image/*" multiple onchange="handleMultipleImages(event)" class="text-xs w-full">
                        <div id="imgsPreviewList" class="flex flex-wrap gap-2 pt-1"></div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">或貼上主圖片網址（未選檔案時使用）</label>
                        <input id="pImg" value="https://images.unsplash.com/photo-1594035910387-fea47794261f?w=600" class="w-full border rounded px-3 py-1.5 text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">調香理念與香氣筆記（支援多行換行）</label>
                        <textarea id="pDesc" rows="4" required class="w-full border rounded px-3 py-2 text-xs" placeholder="請輸入調香理念、前中後調筆記或命定疊香說明..."></textarea>
                    </div>
                    <button type="submit" id="saveProductBtn" class="w-full bg-slate-900 hover:bg-black text-[#e6c786] py-2.5 rounded font-bold">儲存並發佈至前台</button>
                </form>
            </div>

            <div class="lg:col-span-2 bg-white p-6 rounded-lg shadow-sm">
                <div class="flex justify-between items-center mb-4 pb-2 border-b">
                    <h2 id="listCategoryTitle" class="text-base font-bold"><i class="fa-solid fa-boxes-stacked text-blue-600 mr-1.5"></i>目前顯示：全部香氛商品</h2>
                    <span id="adminProductCount" class="text-xs text-slate-400"></span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead><tr class="bg-slate-50 text-slate-500 border-b"><th class="p-2.5">圖片與調香介紹</th><th class="p-2.5">系列分類</th><th class="p-2.5">容量價格</th><th class="p-2.5">庫存</th><th class="p-2.5 text-right">操作</th></tr></thead>
                        <tbody id="adminProductList" class="divide-y"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-sm">
            <h2 class="text-base font-bold mb-4 pb-2 border-b"><i class="fa-solid fa-receipt text-emerald-600 mr-1.5"></i>客戶典藏訂單管理</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead><tr class="bg-slate-50 text-slate-500 border-b"><th class="p-3">訂單號</th><th class="p-3">訂購會員 / 電話</th><th class="p-3">取貨門市 / 配送地址</th><th class="p-3">購買明細</th><th class="p-3">總金額</th><th class="p-3">狀態</th><th class="p-3 text-right">操作</th></tr></thead>
                    <tbody id="adminOrderList" class="divide-y"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let token = sessionStorage.getItem('adminToken') || '';
        let currentImageList = [];
        let allCategories = [], allProducts = [];
        let selectedAdminCat = '全部';

        function handleMultipleImages(e) {
        const files = Array.from(e.target.files);
        files.forEach(file => {
        const reader = new FileReader();
        reader.onload = () => {
        currentImageList.push({ type: 'base64', data: reader.result });
        renderImgsPreview();
        };
        reader.readAsDataURL(file);
        });
        e.target.value = '';
        }

        function removeImg(idx) {
        currentImageList.splice(idx, 1);
        renderImgsPreview();
        }

        function renderImgsPreview() {
        const box = document.getElementById('imgsPreviewList');
        box.innerHTML = currentImageList.map((img, i) => `
        <div class="relative w-16 h-20 rounded border overflow-hidden group">
        <img src="${img.data}" class="w-full h-full object-cover">
        <button type="button" onclick="removeImg(${i})" class="absolute top-0.5 right-0.5 bg-red-600/90 text-white rounded-full w-4 h-4 flex items-center justify-center text-[10px] hover:bg-red-700">×</button>
        ${i === 0 ? '<span class="absolute bottom-0 inset-x-0 bg-black/75 text-[9px] text-[#e6c786] text-center">封面</span>' : ''}
        </div>`).join('');
        }

        async function handleLogin(e) {
        e.preventDefault();
        const res = await fetch('/api/admin/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: document.getElementById('loginUser').value, password: document.getElementById('loginPass').value })
        });
        const data = await res.json();
        if (!res.ok) return alert(data.detail || '登入失敗');
        token = data.token;
        sessionStorage.setItem('adminToken', token);
        document.getElementById('loginScreen').classList.add('hidden');
        loadAdminData();
        }

        function logout() { sessionStorage.removeItem('adminToken'); location.reload(); }

        async function authFetch(url, options = {}) {
        options.headers = { ...(options.headers || {}), 'X-Admin-Token': token, 'Content-Type': 'application/json' };
        const res = await fetch(url, options);
        if (res.status === 401) {
        document.getElementById('loginScreen').classList.remove('hidden');
        throw new Error('管理員登入已逾期，請重新登入');
        }
        return res;
        }

        async function loadAdminData() {
        try {
        const [cRes, pRes, oRes] = await Promise.all([fetch('/api/categories'), fetch('/api/products'), authFetch('/api/orders')]);
        document.getElementById('loginScreen').classList.add('hidden');
        allCategories = await cRes.json();
        allProducts = await pRes.json();
        const orders = await oRes.json();

        renderCategoriesUI();
        renderProductsTable();

        document.getElementById('adminOrderList').innerHTML = orders.length === 0
        ? '<tr><td colspan="7" class="text-center py-8 text-slate-400">目前尚無訂單紀錄</td></tr>'
        : orders.map(o => `
        <tr class="hover:bg-slate-50">
        <td class="p-3 font-bold">#${o.id}</td>
        <td class="p-3"><div class="font-bold">${o.customer_name}</div><div class="text-slate-400">${o.phone}</div></td>
        <td class="p-3">
        <div class="font-bold text-slate-800">${o.shipping_method || '宅配到府'}</div>
        <div class="text-slate-500">${o.address}</div>
        <span class="inline-block mt-1 px-2 py-0.5 rounded text-[10px] font-bold bg-slate-100 text-slate-700 border border-slate-300">
        ${o.payment_method || '貨到付款'}
        </span>
        </td>
        <td class="p-3 text-slate-600">${o.items_summary}</td>
        <td class="p-3 font-bold text-[#c8a45d]">NT$ ${o.total_amount}</td>
        <td class="p-3"><span class="px-2 py-1 rounded font-bold text-[11px] ${o.status === '已出貨' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">${o.status}</span></td>
        <td class="p-3 text-right space-x-1 whitespace-nowrap">
        <button onclick="updateOrderStatus(${o.id}, '已出貨')" class="bg-slate-800 hover:bg-black text-white px-2.5 py-1 rounded">標記出貨</button>
        <button onclick="deleteOrder(${o.id})" class="text-slate-400 hover:text-red-600 px-1.5"><i class="fa-solid fa-trash"></i></button>
        </td>
        </tr>`).join('');
        } catch (e) {}
        }

        function renderCategoriesUI() {
        const totalCount = allProducts.length;
        let html = `<button onclick="filterAdminCat('全部')" class="px-3.5 py-1.5 rounded-full text-xs font-bold transition ${selectedAdminCat === '全部' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">全部系列 (${totalCount})</button>`;
        html += allCategories.map(c => {
        const count = allProducts.filter(p => p.category === c.name).length;
        const active = selectedAdminCat === c.name;
        return `
        <div class="inline-flex items-center rounded-full border ${active ? 'bg-[#c8a45d] text-black border-[#c8a45d] font-bold' : 'bg-white text-slate-700 hover:border-slate-400'}">
        <button onclick="filterAdminCat('${c.name}')" class="pl-3.5 pr-2 py-1.5 text-xs">${c.name} (${count})</button>
        <button onclick="deleteCategory(${c.id}, '${c.name}')" title="刪除此分類" class="pr-3 pl-1 py-1.5 text-xs opacity-60 hover:opacity-100"><i class="fa-solid fa-xmark"></i></button>
        </div>`;
        }).join('');
        document.getElementById('categoryTags').innerHTML = html;

        const currentVal = document.getElementById('pCat').value;
        document.getElementById('pCat').innerHTML = allCategories.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
        if (selectedAdminCat !== '全部') document.getElementById('pCat').value = selectedAdminCat;
        else if (currentVal && allCategories.some(c => c.name === currentVal)) document.getElementById('pCat').value = currentVal;
        }

        function filterAdminCat(cat) {
        selectedAdminCat = cat;
        document.getElementById('listCategoryTitle').innerHTML = `<i class="fa-solid fa-boxes-stacked text-blue-600 mr-1.5"></i>目前顯示：${cat === '全部' ? '全部香氛商品' : '「' + cat + '」底下的商品'}`;
        renderCategoriesUI();
        renderProductsTable();
        }

        function renderProductsTable() {
        const list = selectedAdminCat === '全部' ? allProducts : allProducts.filter(p => p.category === selectedAdminCat);
        document.getElementById('adminProductCount').innerText = `共 ${list.length} 款香氛`;
        document.getElementById('adminProductList').innerHTML = list.length === 0
        ? '<tr><td colspan="5" class="text-center py-12 text-slate-400">此系列目前尚無商品，請由左側新增！</td></tr>'
        : list.map(p => {
        let prices = {};
        try { prices = JSON.parse(p.prices_json || '{}'); } catch(e){}
        const p30 = prices['30ml'] || Math.round(p.price * 0.6);
        const p50 = prices['50ml'] || p.price;
        const p100 = prices['100ml'] || Math.round(p.price * 1.6);
        return `
        <tr class="hover:bg-slate-50">
        <td class="p-2.5 flex items-start gap-3">
        <img src="${p.image_url}" class="w-12 h-14 object-cover rounded border flex-shrink-0">
        <div>
        <div class="font-bold text-slate-800 text-sm">${p.name}</div>
        <div class="text-slate-500 whitespace-pre-line mt-0.5 line-clamp-2">${p.description}</div>
        </div>
        </td>
        <td class="p-2.5"><span class="bg-slate-100 px-2 py-0.5 rounded font-bold">${p.category}</span></td>
        <td class="p-2.5 whitespace-nowrap">
        <div class="text-[11px] text-slate-500">30ml: NT$ ${p30}</div>
        <div class="text-xs font-bold text-slate-900">50ml: NT$ ${p50}</div>
        <div class="text-[11px] text-slate-500">100ml: NT$ ${p100}</div>
        </td>
        <td class="p-2.5 font-bold ${p.stock < 15 ? 'text-red-600' : 'text-emerald-600'}">${p.stock}</td>
        <td class="p-2.5 text-right space-x-1 whitespace-nowrap">
        <button onclick="startEditProduct(${p.id})" class="bg-blue-50 hover:bg-blue-100 text-blue-700 px-2.5 py-1 rounded font-bold"><i class="fa-solid fa-pen mr-1"></i>編輯圖文</button>
        <button onclick="deleteProduct(${p.id})" class="bg-red-50 hover:bg-red-100 text-red-600 px-2.5 py-1 rounded"><i class="fa-solid fa-trash"></i></button>
        </td>
        </tr>`;
        }).join('');
        }

        async function addCategory(e) {
        e.preventDefault();
        const name = document.getElementById('newCatName').value.trim();
        const res = await authFetch('/api/categories', { method: 'POST', body: JSON.stringify({ name }) });
        const data = await res.json();
        if (!res.ok) return alert(data.detail || '新增失敗');
        document.getElementById('newCatName').value = '';
        selectedAdminCat = name;
        loadAdminData();
        }

        async function deleteCategory(id, name) {
        if (!confirm(`確定要刪除「${name}」分類嗎？`)) return;
        await authFetch(`/api/categories/${id}`, { method: 'DELETE' });
        if (selectedAdminCat === name) selectedAdminCat = '全部';
        loadAdminData();
        }

        function startEditProduct(id) {
        const p = allProducts.find(x => x.id === id);
        if (!p) return;
        document.getElementById('editProductId').value = p.id;
        document.getElementById('pCat').value = p.category;
        document.getElementById('pName').value = p.name;

        let prices = {};
        try { prices = JSON.parse(p.prices_json || '{}'); } catch(e){}
        document.getElementById('pPrice30').value = prices['30ml'] || Math.round(p.price * 0.6);
        document.getElementById('pPrice50').value = prices['50ml'] || p.price;
        document.getElementById('pPrice100').value = prices['100ml'] || Math.round(p.price * 1.6);
        document.getElementById('pStock').value = p.stock;
        document.getElementById('pImg').value = p.image_url;
        document.getElementById('pDesc').value = p.description;

        currentImageList = [];
        try {
        const arr = JSON.parse(p.images_json || '[]');
        if (arr.length) arr.forEach(url => currentImageList.push({ type: 'url', data: url }));
        } catch(e){}
        if (!currentImageList.length && p.image_url) currentImageList.push({ type: 'url', data: p.image_url });
        renderImgsPreview();

        document.getElementById('formTitle').innerHTML = `<i class="fa-solid fa-pen text-blue-600 mr-1.5"></i>正在編輯：${p.name}`;
        document.getElementById('saveProductBtn').innerText = '確認儲存修改';
        document.getElementById('cancelEditBtn').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
        document.getElementById('editProductId').value = '';
        document.getElementById('pName').value = '';
        document.getElementById('pDesc').value = '';
        document.getElementById('pFiles').value = '';
        currentImageList = [];
        renderImgsPreview();
        document.getElementById('formTitle').innerHTML = `<i class="fa-solid fa-pen-to-square text-[#c8a45d] mr-1.5"></i>上架新香氛與圖文介紹`;
        document.getElementById('saveProductBtn').innerText = '儲存並發佈至前台';
        document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        async function saveProduct(e) {
        e.preventDefault();
        try {
        const editId = document.getElementById('editProductId').value;
        const p30 = parseInt(document.getElementById('pPrice30').value) || 1800;
        const p50 = parseInt(document.getElementById('pPrice50').value) || 3000;
        const p100 = parseInt(document.getElementById('pPrice100').value) || 4800;
        const stock = parseInt(document.getElementById('pStock').value) || 30;

        const payload = {
        name: document.getElementById('pName').value.trim(),
        category: document.getElementById('pCat').value,
        price: p50,
        prices_json: JSON.stringify({ "30ml": p30, "50ml": p50, "100ml": p100 }),
        stock: stock,
        image_url: currentImageList[0] ? currentImageList[0].data : document.getElementById('pImg').value.trim(),
        images_list: currentImageList.filter(x => x.type === 'url').map(x => x.data),
        images_base64: currentImageList.filter(x => x.type === 'base64').map(x => x.data),
        description: document.getElementById('pDesc').value.trim()
        };

        const url = editId ? `/api/products/${editId}` : '/api/products';
        const method = editId ? 'PUT' : 'POST';
        const res = await authFetch(url, { method, body: JSON.stringify(payload) });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
        alert('儲存失敗：' + (data.detail || '請確認後端 Python 是否已重新啟動'));
        return;
        }
        alert('✨ 香氛商品儲存並發佈成功！');
        resetForm();
        loadAdminData();
        } catch (err) {
        alert('操作提示：' + err.message);
        }
        }

        async function deleteProduct(id) {
        if (confirm('確定要下架刪除此香氛嗎？')) {
        await authFetch(`/api/products/${id}`, { method: 'DELETE' });
        loadAdminData();
        }
        }

        async function updateOrderStatus(id, status) {
        await authFetch(`/api/orders/${id}/status?status=${encodeURIComponent(status)}`, { method: 'PATCH' });
        loadAdminData();
        }

        async function deleteOrder(id) {
        if (confirm('確定要刪除此筆訂單嗎？')) {
        await authFetch(`/api/orders/${id}`, { method: 'DELETE' });
        loadAdminData();
        }
        }

        if (token) loadAdminData();
    </script>
</body>
</html>
